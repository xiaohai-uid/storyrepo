[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "storyrepo"
version = "0.2.0"
description = "storyrepo 长篇生产引擎:合同/任务书/四路上下文/机检/追踪/双视图/回炉(机制来自 webnovel-writer·oh-story·AI_NovelGenerator·chinese-novelist)"
requires-python = ">=3.9"

[project.scripts]
storyrepo = "storyrepo.cli:main"

[tool.setuptools.packages.find]
include = ["storyrepo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
extend-exclude = ["vendor"]

[tool.ruff.lint]
# 基线显式收窄：pycodestyle 错误(E4/E7/E9) + pyflakes(F) + isort 导入排序(I) + bugbear(B)
# 注：ruff 0.16 起内置默认已扩张到 UP/SIM/S 等现代化规则族，
#     本仓 %-formatting / typing.List 存量大，刻意不启用，留作后续渐进收紧。
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# conftest 先做 sys.path 引导再 import,属合法模式
"tests/conftest.py" = ["E402"]
